:root{
  --bg:#0B0F0E;--bg-elev:#14191A;--bg-card:#181E20;--bg-card-hover:#1F2628;
  --border:rgba(255,255,255,0.06);--border-strong:rgba(255,255,255,0.12);
  --text:#F2F2F0;--text-muted:#9CA3A0;--text-dim:#5C6562;
  --accent:#3DDC84;--accent-dim:rgba(61,220,132,0.15);
  --blue:#22D3EE;--blue-dim:rgba(34,211,238,0.12);
  --danger:#E5484D;--danger-dim:rgba(229,72,77,0.12);
  --warn:#FACC15;--warn-dim:rgba(250,204,21,0.12);
  --orange:#F97316;--orange-dim:rgba(249,115,22,0.12);
  --header-h:72px;--nav-h:64px;--gap:12px;--radius:14px;
}
[data-theme="light"]{
  --bg:#FAFAF9;--bg-elev:#FFFFFF;--bg-card:#FFFFFF;--bg-card-hover:#F5F5F4;
  --border:rgba(0,0,0,0.06);--border-strong:rgba(0,0,0,0.12);
  --text:#0B0F0E;--text-muted:#4F5552;--text-dim:#8B918E;
  --accent:#16A34A;--accent-dim:rgba(22,163,74,0.12);
  --blue:#0891B2;--blue-dim:rgba(8,145,178,0.10);
  --danger:#DC2626;--danger-dim:rgba(220,38,38,0.08);
  --warn:#CA8A04;--warn-dim:rgba(202,138,4,0.10);
  --orange:#EA580C;--orange-dim:rgba(234,88,12,0.10);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}button,a,[onclick]{touch-action:manipulation;}
html,body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;}
body{min-height:100vh;padding-top:var(--header-h);padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom));}
.header{position:fixed;top:0;left:0;right:0;height:var(--header-h);background:var(--bg-elev);border-bottom:1px solid var(--border);display:flex;flex-direction:column;align-items:stretch;justify-content:center;padding:6px 16px 4px;z-index:100;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);}.header-row{display:flex;align-items:center;width:100%;gap:0;}.header-tagline{font-size:10px;color:var(--text-dim);letter-spacing:0.04em;text-align:center;width:100%;padding-top:2px;}
.header-title{font-size:1rem;font-weight:700;flex:1;}
.theme-toggle{width:36px;height:36px;border:none;background:transparent;color:var(--text-muted);cursor:pointer;border-radius:8px;display:flex;align-items:center;justify-content:center;}
.page{max-width:640px;margin:0 auto;padding:var(--gap);display:flex;flex-direction:column;gap:10px;}
.sec-hdr{font-size:0.67rem;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--text-dim);padding:4px 2px 2px;}
.card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;}

/* Profile Hero */
.profile-hero{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:20px 16px;text-align:center;}
.profile-avatar{width:72px;height:72px;border-radius:50%;background:var(--accent-dim);border:2px solid var(--accent);display:flex;align-items:center;justify-content:center;font-size:2rem;margin:0 auto 12px;}
.profile-username{font-size:1.3rem;font-weight:800;letter-spacing:-0.02em;margin-bottom:4px;}
.profile-uid{font-size:0.65rem;color:var(--text-dim);font-family:monospace;margin-bottom:12px;}
.profile-followed{display:inline-flex;align-items:center;gap:6px;background:var(--accent-dim);border:1px solid rgba(61,220,132,0.3);border-radius:20px;padding:4px 12px;font-size:0.75rem;font-weight:600;color:var(--accent);}

/* Stats Grid */
.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.stat-box{background:var(--bg-elev);border-radius:10px;padding:12px;text-align:center;}
.stat-box-val{font-size:1.4rem;font-weight:800;}
.stat-box-lbl{font-size:0.65rem;color:var(--text-dim);margin-top:2px;text-transform:uppercase;letter-spacing:0.5px;}
.stat-box.accent .stat-box-val{color:var(--accent);}
.stat-box.blue .stat-box-val{color:var(--blue);}
.stat-box.warn .stat-box-val{color:var(--warn);}
.stat-box.orange .stat-box-val{color:var(--orange);}

/* Trophies */
.trophy-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.trophy-item{background:var(--bg-elev);border-radius:10px;padding:12px;display:flex;align-items:center;gap:10px;}
.trophy-icon{font-size:1.8rem;flex-shrink:0;}
.trophy-name{font-size:0.78rem;font-weight:700;}
.trophy-desc{font-size:0.65rem;color:var(--text-dim);margin-top:2px;}
.trophy-locked{opacity:0.35;filter:grayscale(1);}
.trophy-progress{margin-top:4px;}
.progress-bar{height:3px;background:var(--border-strong);border-radius:2px;overflow:hidden;}
.progress-fill{height:100%;background:var(--accent);border-radius:2px;transition:width 0.4s;}
.progress-lbl{font-size:0.6rem;color:var(--text-dim);margin-top:2px;}

/* Your Club card */
.club-row{display:flex;align-items:center;gap:13px;}
.club-badge{width:46px;height:46px;object-fit:contain;flex-shrink:0;}
.club-name{font-size:1rem;font-weight:800;line-height:1.15;}
.club-league{font-size:0.68rem;color:var(--text-muted);margin-top:2px;text-transform:uppercase;letter-spacing:0.5px;}
.club-fixture{margin-top:12px;padding-top:12px;border-top:1px solid var(--border);font-size:0.78rem;color:var(--text-muted);line-height:1.5;}
.club-fixture b{color:var(--text);font-weight:700;}
.club-actions{display:flex;gap:8px;margin-top:13px;}
.club-btn{flex:1;text-align:center;padding:9px;border-radius:10px;font-size:0.76rem;font-weight:700;text-decoration:none;cursor:pointer;border:1px solid var(--border);background:var(--bg-elev);color:var(--text);}
.club-btn.primary{background:var(--accent);color:#0B0F0E;border:none;}
/* Closest Trophy card */
.ct-row{display:flex;align-items:center;gap:13px;}
.ct-icon{font-size:1.9rem;flex-shrink:0;}
.ct-label{font-size:0.62rem;color:var(--accent);font-weight:700;letter-spacing:0.06em;text-transform:uppercase;}
.ct-name{font-size:0.95rem;font-weight:800;margin-top:1px;}
.ct-desc{font-size:0.7rem;color:var(--text-muted);margin-top:1px;}

/* Predictions */
.pred-row{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border);font-size:0.8rem;}
.pred-row:last-child{border-bottom:none;}
.pred-match{font-weight:600;flex:1;}
.pred-pick{font-size:0.7rem;color:var(--text-muted);}
.pred-result-w{color:var(--accent);font-weight:700;}
.pred-result-p{color:var(--blue);font-weight:700;}

/* Settings */
.setting-row{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--border);}
.setting-row:last-child{border-bottom:none;}
.setting-label{font-size:0.85rem;font-weight:600;}
.setting-value{font-size:0.75rem;color:var(--text-muted);}
.setting-btn{background:var(--bg-elev);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:5px 12px;font-size:0.75rem;cursor:pointer;font-family:inherit;}
.setting-btn:hover{border-color:var(--accent);color:var(--accent);}
.setting-btn.danger{color:var(--danger);border-color:var(--danger-dim);}

/* Honesty card */
.honesty-card{background:var(--accent-dim);border:1px solid rgba(61,220,132,0.2);border-radius:var(--radius);padding:14px 16px;}
.honesty-title{font-size:0.75rem;font-weight:700;color:var(--accent);margin-bottom:6px;}
.honesty-text{font-size:0.78rem;color:var(--text);line-height:1.6;}

.empty-state{text-align:center;padding:20px;color:var(--text-dim);font-size:0.82rem;}
.me-pills{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:4px 0 8px;margin-bottom:4px;}
.me-pills::-webkit-scrollbar{display:none;}
.me-pill{flex-shrink:0;padding:8px 16px;border-radius:20px;border:1px solid var(--border);background:var(--bg-elev);color:var(--text-muted);font-size:0.8rem;font-weight:600;cursor:pointer;font-family:inherit;transition:all 0.15s;}
.me-pill.active{background:var(--accent-dim);border-color:var(--accent);color:var(--accent);}
.footer-mini{text-align:center;font-size:0.68rem;color:var(--text-dim);padding:16px 0 4px;}
.fav-list{display:flex;flex-direction:column;gap:8px;}
.fav-item{display:flex;align-items:center;gap:10px;background:var(--bg-card);border:1px solid var(--border);border-radius:12px;padding:12px 14px;}
.fav-icon{font-size:1.2rem;flex-shrink:0;}
.fav-label{flex:1;font-size:0.88rem;font-weight:600;color:var(--text);}
.fav-meta{font-size:0.72rem;color:var(--text-dim);text-transform:capitalize;margin-right:4px;}
.fav-link{font-size:0.75rem;color:var(--accent);text-decoration:none;font-weight:600;padding:4px 8px;border:1px solid var(--accent);border-radius:8px;flex-shrink:0;}
.fav-remove{background:none;border:none;color:var(--text-dim);cursor:pointer;font-size:0.85rem;padding:4px;flex-shrink:0;}
.nav-item.tournament-active{color:#F97316;}.nav-item.tournament-active svg{width:24px;height:24px;}.nav-item.tournament-active span{font-size:0.72rem;font-weight:700;}.theme-toggle{visibility:hidden!important;margin-left:auto;pointer-events:none!important;}#restoreCodeInput::placeholder{color:var(--text-dim);opacity:.45;letter-spacing:.1em}
#recoveryCodeDisplay:not(.rv){filter:blur(7px);cursor:pointer;user-select:none}
</style>

var POLL_API='';
function mwEsc(t){return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function getLS(k,d){try{return localStorage.getItem(k)||d;}catch(e){return d;}}
function setLS(k,v){try{localStorage.setItem(k,v);}catch(e){}}
function getJSON(k,d){try{return JSON.parse(localStorage.getItem(k)||'null')||d;}catch(e){return d;}}
function mwUuidFallback(){return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,function(c){var r=Math.random()*16|0,v=c==='x'?r:(r&0x3|0x8);return v.toString(16);});}
function mwEnsureUid(){var u=getLS('nmw_uid','');if(u)return u;var nu=(window.crypto&&window.crypto.randomUUID)?window.crypto.randomUUID():mwUuidFallback();setLS('nmw_uid',nu);return nu;}
mwEnsureUid();

// ── Streak ──────────────────────────────────────────────────────────────────
function mwStreak(){
  var today=new Date().toISOString().slice(0,10);
  var last=getLS('nmw_last_visit','');
  var cur=parseInt(getLS('nmw_streak','0'))||0;
  var prev=cur;
  if(last!==today){
    var y=new Date(Date.now()-86400000).toISOString().slice(0,10);
    cur=(last===y)?cur+1:1;
    setLS('nmw_streak',cur);setLS('nmw_last_visit',today);
    var lng=parseInt(getLS('nmw_longest_streak','0'))||0;
    if(cur>lng)setLS('nmw_longest_streak',cur);
    // Server-side streak recording + milestone push
    var uid=getLS('nmw_uid','');
    if(uid){
      fetch(POLL_API+'/streak/update',{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({uid:uid,streak:cur,prev_streak:prev})
      }).catch(function(){});
    }
  }
  return cur;
}

function checkTrophies(){
  var streak=parseInt(getLS('nmw_streak','0'))||0;
  var preds=getJSON('nmw_pred_log',[]);
  var correct=preds.filter(function(p){return p.result==='W';}).length;
  var polls=parseInt(getLS('nmw_poll_count','0'))||0;
  var guessCorrect=parseInt(getLS('nmw_guess_correct_count','0'))||0;
  var club=getLS('nmw_followed_team','');
  var country=getLS('nmw_followed_country','');
  // Auto-award based on state
  awardTrophy('first_visit');
  if(club)awardTrophy('follow_club');
  if(country)awardTrophy('follow_country');
  if(club&&country)awardTrophy('follow_both');
  if(preds.length>=1)awardTrophy('first_prediction');
  if(preds.length>=10)awardTrophy('predictions_10');
  if(preds.length>=50)awardTrophy('predictions_50');
  if(preds.length>=100)awardTrophy('predictions_100');
  if(correct>=5)awardTrophy('correct_5');
  if(correct>=25)awardTrophy('correct_25');
  if(polls>=1)awardTrophy('first_poll');
  if(polls>=5)awardTrophy('polls_5');
  if(guessCorrect>=1)awardTrophy('guess_correct');
  if(guessCorrect>=10)awardTrophy('guess_correct_10');
  if(streak>=3)awardTrophy('streak_3');
  if(streak>=7)awardTrophy('streak_7');
  if(streak>=30)awardTrophy('streak_30');
  if(streak>=365)awardTrophy('streak_365');
  if(preds.length>=20&&correct/preds.length>=0.7)awardTrophy('accuracy_70');
  // Perfect week — 7-day streak
  if(streak>=7)awardTrophy('perfect_week');
  // Guess elite 10 — check localStorage for elite guess count
  var eliteGuess=parseInt(getLS('nmw_guess_elite_count','0'))||0;
  if(eliteGuess>=10)awardTrophy('guess_elite_10');
  // Top 500/100 checked via leaderboard rank stored locally
  var myRank=parseInt(getLS('nmw_leaderboard_rank','0'))||0;
  if(myRank>0&&myRank<=500)awardTrophy('top_500');
  if(myRank>0&&myRank<=100)awardTrophy('top_100_trophy');
  // All common
  var commonIds=['first_visit','follow_club','follow_country','first_prediction','first_poll','first_trivia'];
  var earned=getEarnedTrophies();
  if(commonIds.every(function(id){return earned.indexOf(id)!==-1;}))awardTrophy('all_common');
}

function reconcileSettled(done){
  fetch('/data/settled_predictions.json?'+Date.now())
    .then(function(r){return r.json();})
    .then(function(s){
      s=s||{};
      var preds=getJSON('nmw_pred_log',[]);
      var changed=false;
      preds.forEach(function(p){
        var e=s[p.poll_id];
        if(!e||!e.result)return;
        if(p.result===null||p.result===undefined||!p.score){
          p.result=(String(e.result).toLowerCase()===String(p.pick||'').toLowerCase())?'W':'L';
          p.score=e.score||'';
          p.final=e.result;
          changed=true;
        }
      });
      if(changed)setLS('nmw_pred_log',JSON.stringify(preds));
      if(done)done(changed);
    })
    .catch(function(){if(done)done(false);});
}
function postLeaderboard(){
  var uid=getLS('nmw_uid','anon');

    body:JSON.stringify({uid:uid,name:name,predictions:preds.length,correct:correct,trophyPoints:getTrophyPoints()})
  }).catch(function(){});
}

  }

      +'style="width:100%;padding:9px;border-radius:10px;border:1px solid var(--border);background:none;color:var(--text-muted);font-size:0.8rem;cursor:pointer;font-family:inherit;margin-bottom:8px;">Next Clue (lose a point)</button>';
  }
  if(hint&&clueState>=1){
    html+='<div style="font-size:0.75rem;color:var(--orange);margin-bottom:8px;">&#x1F4A1; Hint: '+mwEsc(hint)+'</div>';
  }

    +'style="width:100%;box-sizing:border-box;padding:10px 12px;border-radius:10px;border:1px solid var(--border-strong);background:var(--bg-card);color:var(--text);font-size:0.9rem;font-family:inherit;margin-bottom:8px;">'
    +'<button onclick="submitGuess(\''+mwEsc(answer)+'\',\''+mwEsc(gp._key||key)+'\','+clueState+')" '
    +'style="width:100%;padding:11px;border-radius:10px;border:none;background:var(--accent);color:#000;font-size:0.88rem;font-weight:700;cursor:pointer;font-family:inherit;">Submit Answer</button>'
    +'</div>';

function submitGuess(answer,key,clueUsed){
  var inp=document.getElementById('me-guess-input');
  if(!inp)return;
  var guess=(inp.value||'').trim().toLowerCase();
  var ans=answer.toLowerCase();
  function norm(s){return s.toLowerCase().replace(/[^a-z]/g,'');}
  function fuzzy(a,b){if(a===b)return true;if(b.indexOf(a)!==-1&&a.length>3)return true;var na=norm(a),nb=norm(b);if(na===nb)return true;if(nb.indexOf(na)!==-1&&na.length>3)return true;var dist=0;var len=Math.max(na.length,nb.length);for(var i=0;i<Math.min(na.length,nb.length);i++){if(na[i]!==nb[i])dist++;}dist+=Math.abs(na.length-nb.length);return dist<=2&&na.length>=4;}
  var correct=fuzzy(guess,ans);
  var score=correct?(clueUsed===0?'elite':clueUsed===1?'sharp':'got'):'miss';
  var dateKey=new Date().toISOString().slice(0,10);
  setLS('nmw_guess_'+dateKey,JSON.stringify({score:score,guess:inp.value,answer:answer}));
  if(correct){
    var gc=parseInt(getLS('nmw_guess_correct_count','0'))||0;
    setLS('nmw_guess_correct_count',gc+1);
    awardTrophy('guess_correct');
    if(clueUsed===0){
      var ec=parseInt(getLS('nmw_guess_elite_count','0'))||0;
      setLS('nmw_guess_elite_count',ec+1);
      if(ec+1>=10)awardTrophy('guess_elite_10');
    }
  }
  // Post to community
  fetch(POLL_API+'/community/guess/'+encodeURIComponent(key),{
    method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({result:score})
  }).catch(function(){});
  renderPage();
}

function loadGuessCommunity(key){
  var el=document.getElementById('me-guess-community');
  if(!el)return;
  fetch(POLL_API+'/community/guess/'+encodeURIComponent(key))
    .then(function(r){return r.json();})
    .then(function(d){
      var total=(d.clue1||0)+(d.clue2||0)+(d.clue3||0)+(d.miss||0);
      if(!total){el.innerHTML='<div style="font-size:0.72rem;color:var(--text-dim);">No community results yet.</div>';return;}
      var pct=function(n){return total?Math.round(n/total*100):0;};
      el.innerHTML='<div style="font-size:0.7rem;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--text-dim);margin-bottom:8px;">Community Results ('+total+' players)</div>'
        +bar('Elite (clue 1)',pct(d.clue1),'var(--accent)')
        +bar('Sharp (clue 2)',pct(d.clue2),'var(--warn)')
        +bar('Got There (clue 3)',pct(d.clue3),'var(--blue)')
        +bar('Missed',pct(d.miss),'var(--danger)');
    }).catch(function(){if(el)el.innerHTML='';});
}

  var losses=preds.filter(function(p){return p.result==='L';}).reverse();

  var winBtn=document.getElementById('predTabWins');

  if(winBtn)winBtn.className='pred-tab-btn'+(tab==='wins'?' active':'');

  var btn=document.getElementById('predExpandBtn');
  if(sm){sm.style.display=list.length>3?'block':'none';}

  window._predExpanded=false;
}

function lbFmt(n){try{return Number(n).toLocaleString('en-GB');}catch(e){return String(n);}}
function loadLeaderboard(tab){

  if(!el)return;

    st.textContent=[

      '.lb-ban small{display:block;margin-top:3px;font-size:.72rem;color:var(--text-muted)}',
      '.lb-ban .r{font-size:1.4rem;font-weight:900;line-height:1;color:var(--accent);font-variant-numeric:tabular-nums;text-align:right}',
      '.lb-ban .rr{text-align:right}',
      '.lb-off{background:var(--bg-elev);border-color:var(--border-strong)}',
      '.lb-off .k{color:var(--text-muted)}',
      '.lb-prog{height:6px;border-radius:3px;background:var(--border-strong);overflow:hidden;margin-top:8px}',
      '.lb-prog i{display:block;height:100%;background:var(--accent);border-radius:3px}',
      '.lb-h,.lb-row{display:grid;grid-template-columns:34px minmax(0,1fr) auto;align-items:center;gap:10px;padding:9px 6px}',
      '.lb-h{font-size:.64rem;font-weight:800;letter-spacing:.6px;text-transform:uppercase;color:var(--text-dim);border-bottom:1px solid var(--border-strong)}',
      '.lb-h span:last-child{text-align:right}',
      '.lb-row{min-height:44px;border-bottom:1px solid var(--border)}',
      '.lb-rk{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.76rem;font-weight:800;color:var(--text-muted);font-variant-numeric:tabular-nums}',
      '.lb-m1{background:var(--warn-dim);color:var(--warn)}.lb-m2{background:var(--border-strong);color:var(--text)}.lb-m3{background:var(--orange-dim);color:var(--orange)}',
      '.lb-nm{font-size:.86rem;font-weight:600;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}',
      '.lb-nm em{font-style:normal;font-size:.6rem;font-weight:800;margin-left:8px;padding:2px 7px;border-radius:999px;background:var(--accent);color:#000;text-transform:uppercase;letter-spacing:.4px;vertical-align:1px}',
      '.lb-v{text-align:right}',
      '.lb-v b{display:block;font-size:.9rem;font-weight:800;color:var(--text);font-variant-numeric:tabular-nums}',
      '.lb-v small{display:block;font-size:.64rem;color:var(--text-dim)}',
      '.lb-me{background:var(--accent-dim);border-radius:10px;border-bottom-color:transparent}',
      '.lb-me .lb-nm{color:var(--accent);font-weight:800}',
      '.lb-gap{text-align:center;color:var(--text-dim);letter-spacing:5px;font-size:.8rem;line-height:1;padding:2px 0}',
      '.lb-note{margin-top:10px;font-size:.68rem;color:var(--text-dim)}',
      '.lb-retry{margin-left:8px;padding:5px 12px;border-radius:8px;border:1px solid var(--border-strong);background:none;color:var(--text);font:inherit;font-size:.72rem;font-weight:700;cursor:pointer}'
    ].join('');
    document.head.appendChild(st);
  }
  var uid=getLS('nmw_uid','');
  fetch(POLL_API+'/leaderboard?uid='+encodeURIComponent(uid),{cache:'no-cache'})
    .then(function(r){if(!r.ok)throw new Error(r.status);return r.json();})
    .then(function(d){
      var me=d.me||{},isPred=(tab==='pred');
      var list=(isPred?d.predictions:d.trophies)||[];
      if(!isPred)list=list.filter(function(u){return (u.trophyPoints||0)>0;});
      var log=getJSON('nmw_pred_log',[]);
      var myN=log.length,myC=log.filter(function(p){return p.result==='W';}).length;
      var myPts=(typeof getTrophyPoints==='function')?(getTrophyPoints()||0):0;
      var myName=getLS('nmw_username','You');
      var myRank=isPred?me.pred_rank:(myPts>0?me.trophy_rank:null);
      var total=isPred?me.pred_of:me.trophy_of;
      if(isPred&&myRank){setLS('nmw_leaderboard_rank',String(myRank));}
      var myIdx=-1;
      for(var i=0;i<list.length;i++){if(me.pid&&list[i].pid===me.pid){myIdx=i;break;}}
      function val(u){return isPred?(u.predictions?Math.round(u.correct/u.predictions*100)+'%':'--'):lbFmt(u.trophyPoints);}
      function sub(u){return isPred?(u.correct||0)+'/'+(u.predictions||0)+' correct':'points';}
      function row(u,rank,isMe){
        return '<div class="lb-row'+(isMe?' lb-me':'')+'"><span class="lb-rk'+(rank<=3?' lb-m'+rank:'')+'">'+rank+'</span>'
          +'<span class="lb-nm">'+mwEsc(u.name||'Anonymous')+(isMe?'<em>You</em>':'')+'</span>'
          +'<span class="lb-v"><b>'+val(u)+'</b><small>'+sub(u)+'</small></span></div>';
      }
      var html='',mine=null;
      if(myRank){
        mine=(myIdx>=0)?list[myIdx]:{name:myName,predictions:myN,correct:myC,trophyPoints:myPts};
        html+='<div class="lb-ban"><div><div class="k">Your global rank</div><small>'
          +(isPred?(mine.correct||0)+' of '+(mine.predictions||0)+' correct ('+val(mine)+')':lbFmt(mine.trophyPoints)+' trophy points')
          +'</small></div><div class="rr"><div class="r">#'+lbFmt(myRank)+'</div><small>of '+lbFmt(total)+(isPred?' qualified':' players')+'</small></div></div>';
      }else if(isPred){
        var need=Math.max(0,10-myN);
        html+=need>0
          ?'<div class="lb-ban lb-off"><div style="flex:1"><div class="k">Join the table</div><small>Make '+need+' more pick'+(need===1?'':'s')+' to get a rank ('+myN+' of 10 so far).</small><div class="lb-prog"><i style="width:'+Math.min(100,myN*10)+'%"></i></div></div></div>'
          :'<div class="lb-ban lb-off"><div><div class="k">Join the table</div><small>Your rank appears once your picks have been counted. Check back after the next full-time whistle.</small></div></div>';
      }else{
        html+='<div class="lb-ban lb-off"><div><div class="k">Join the table</div><small>Earn your first trophy to appear here.</small></div></div>';
      }
      if(!list.length){el.innerHTML=html+'<div class="lb-note">No ranked players yet. Be the first!</div>';return;}
      html+='<div class="lb-h"><span>#</span><span>Player</span><span>'+(isPred?'Accuracy':'Points')+'</span></div>';
      list.slice(0,20).forEach(function(u,i){html+=row(u,i+1,i===myIdx);});
      if(myRank&&(myIdx<0||myIdx>=20)){html+='<div class="lb-gap">&middot;&middot;&middot;</div>'+row(mine,myRank,true);}
      html+='<div class="lb-note">'+(isPred?'Ranked by accuracy. You need 10 picks to qualify.':'Ranked by trophy points.')+' Top 20 shown.</div>';
      el.innerHTML=html;
    })
    .catch(function(){el.innerHTML='<div class="lb-note">Could not load the leaderboard.<button class="lb-retry" onclick="loadLeaderboard(&quot;'+tab+'&quot;)">Retry</button></div>';});
}

function mwEsc(t){return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

function mwFixtureWhen(iso){
  if(!iso)return '';
  try{
    var dt=new Date(iso);
    if(isNaN(dt.getTime()))return '';
    var days=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
    var months=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    var p={};new Intl.DateTimeFormat('en-GB',{timeZone:'Europe/London',weekday:'short',day:'numeric',month:'short',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).formatToParts(dt).forEach(function(x){p[x.type]=x.value;});return p.weekday+' '+p.day+' '+p.month+', '+p.hour+':'+p.minute;
  }catch(e){return '';}
}

// Closest trophy: nearest unearned by completion percent
function closestTrophyHTML(){
  var trophies=getTrophies();
  var best=null;var bestPct=-1;
  ALL_TROPHIES.forEach(function(tr){
    if(trophies.includes(tr.id))return;
    var count=getActionCount(tr.trigger);
    if(count>=tr.target)return;
    var pct=Math.min(100,count/tr.target*100);
    if(pct>bestPct){bestPct=pct;best=tr;best._count=count;best._pct=Math.round(pct);}
  });
  if(!best){
    return '<div class="sec-hdr">Closest Trophy</div><div class="card">'+
      '<div class="ct-row"><div class="ct-icon">&#127942;</div>'+
      '<div style="flex:1;min-width:0;"><div class="ct-label" style="color:var(--warn)">Complete</div>'+
      '<div class="ct-name">All trophies unlocked</div>'+
      '<div class="ct-desc">You have earned every badge. More coming soon.</div></div></div></div>';
  }
  var remain=best.target-best._count;
  return '<div class="sec-hdr">Closest Trophy</div><div class="card">'+
    '<div class="ct-row"><div class="ct-icon">'+best.icon+'</div>'+
    '<div style="flex:1;min-width:0;"><div class="ct-label">Almost there</div>'+
    '<div class="ct-name">'+best.name+'</div>'+
    '<div class="ct-desc">'+best.desc+'</div></div></div>'+
    '<div class="progress-bar"><div class="progress-fill" style="width:'+best._pct+'%"></div></div>'+
    '<div class="progress-lbl">'+best._count+' / '+best.target+' &middot; '+remain+' to go</div></div>';
}

function fillClubCard(followed){
  if(!followed)return;
  fetch('/data/clubs.json').then(function(r){return r.json();}).then(function(d){
    var clubs=(d&&d.all)?d.all:[];
    var club=null;
    for(var i=0;i<clubs.length;i++){if(clubs[i].name===followed){club=clubs[i];break;}}
    if(club){
      var ph=document.getElementById('club-badge-ph');
      if(ph&&club.badge_url){
        var img=document.createElement('img');
        img.className='club-badge';
        img.src=club.badge_url;
        img.alt='';
        img.onerror=function(){this.style.display='none';};
        ph.parentNode.replaceChild(img,ph);
      }
      var lg=document.getElementById('club-league');
      if(lg)lg.textContent=club.league_name||'';
    } else {
      var lg2=document.getElementById('club-league');
      if(lg2)lg2.textContent='';
    }
  }).catch(function(e){
    var lg=document.getElementById('club-league');
    if(lg)lg.textContent='';
  });
  fetch('/data/fixtures.json').then(function(r){return r.json();}).then(function(d){
    var live=(d&&d.live)?d.live:[];
    var upcoming=(d&&d.upcoming)?d.upcoming:[];
    var fx=null;var isLive=false;
    for(var i=0;i<live.length;i++){if(live[i].home===followed||live[i].away===followed){fx=live[i];isLive=true;break;}}
    if(!fx){for(var j=0;j<upcoming.length;j++){if(upcoming[j].home===followed||upcoming[j].away===followed){fx=upcoming[j];break;}}}
    var box=document.getElementById('club-fixture');
    if(!box)return;
    if(fx){
      var label=isLive?'Live now':'Next up';
      var when=mwFixtureWhen(fx.kickoff_utc);
      box.innerHTML=label+': <b>'+mwEsc(fx.home||'')+' vs '+mwEsc(fx.away||'')+'</b>'+(when?'<br>'+mwEsc(when):'');
      fetch('/data/tip_upcoming.json?t='+Date.now()).then(function(r){return r.json();}).then(function(T){var t=T[(String(fx.home)+'|'+String(fx.away)).toLowerCase()];if(t){box.innerHTML+='<br><a href="'+t.path+'" style="display:inline-block;margin-top:6px;color:#22d3ee;font-weight:700;text-decoration:none"><svg viewBox="0 0 24 24" width="12" height="12" fill="currentColor" aria-hidden="true" style="vertical-align:-1px;margin-right:3px"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/></svg>StatIQ · '+mwEsc(t.label)+(t.odds?' @ '+mwEsc(t.odds):'')+' ›</a>';}}).catch(function(){}); /* ME_TIP_20261108 */
      box.style.display='block';
    } else {
      box.innerHTML='No upcoming fixture scheduled';
      box.style.display='block';
    }
  }).catch(function(e){});
}

function mwAwardTrophies(){
  var earned=getTrophies();
  var changed=false;
  ALL_TROPHIES.forEach(function(tr){
    if(earned.includes(tr.id))return;
    var count=getActionCount(tr.trigger);
    if(count>=tr.target){

      changed=true;
    }
  });
  if(changed){
    try{localStorage.setItem('nmw_trophies',JSON.stringify(earned));}catch(e){}
  }
  return changed;
}

async function initPushStatus(){
  if(!('Notification' in window)||!('serviceWorker' in navigator)){
    var el=document.getElementById('push-status');
    var btn=document.getElementById('push-btn');
    if(el)el.textContent='Add to home screen to enable';
    if(btn)btn.style.display='none';
    return;
  }
  var perm=Notification.permission;
  var el=document.getElementById('push-status');
  var btn=document.getElementById('push-btn');
  if(perm==='granted'){
    var reg=await navigator.serviceWorker.ready;
    var sub=await reg.pushManager.getSubscription();
    if(sub){
      if(el)el.textContent='Enabled';
      if(btn)btn.textContent='Disable';
      var ptl=document.getElementById('push-types-list');if(ptl)ptl.style.display='';
      return;
    }
    if(window.PushManager90min){if(el)el.textContent='Reconnecting...';await window.PushManager90min.subscribeToPush({breaking_news:true,transfers:true,goals:true,kickoff:true,ft:true,motm_open:true,motm_result:true,prediction_result:true,trophies:true});var sub2=await reg.pushManager.getSubscription();if(sub2){if(el)el.textContent='Enabled';if(btn)btn.textContent='Disable';return;}}
  }
  if(perm==='denied'){
    if(el)el.textContent='Blocked in browser';
    if(btn)btn.style.display='none';
    return;
  }
  if(el)el.textContent='Disabled';
  if(btn)btn.textContent='Enable';
  var ptl=document.getElementById('push-types-list');if(ptl)ptl.style.display='none';
}
async function togglePushNotifications(){
  var btn=document.getElementById('push-btn');
  var el=document.getElementById('push-status');
  if(!window.PushManager90min){
    alert('Push notifications not available.');
    return;
  }
  var perm=await window.PushManager90min.getNotificationState();
  if(perm==='granted'){
    var reg=await navigator.serviceWorker.ready;
    var sub=await reg.pushManager.getSubscription();
    if(sub){
      await window.PushManager90min.unsubscribeFromPush();
      if(el)el.textContent='Disabled';
      if(btn)btn.textContent='Enable';
      return;
    }
  }
  if(btn)btn.textContent='Enabling...';
  var ok=await window.PushManager90min.subscribeToPush({breaking_news:true,transfers:true,goals:true,kickoff:true,ft:true,motm_open:true,motm_result:true,prediction_result:true,trophies:true});
  if(ok){
    if(el)el.textContent='Enabled';
    if(btn)btn.textContent='Disable';
  } else {
    if(el)el.textContent='Failed — check browser permissions';
    if(btn)btn.textContent='Enable';
  }
}
// Init push status on load
if(document.readyState==='loading'){

} else {

}

async function settlePredictions(){
  try{
    var log=JSON.parse(localStorage.getItem('nmw_pred_log')||'[]');
    if(!log.length)return;
    var res=await fetch('/data/results.json?'+Date.now());
    if(!res||!res.ok)return;
    var rData=await res.json();
    var changed=false;
    log.forEach(function(entry){
      if(entry.result!==null)return;
      if(!entry.match_id)return;
      var rx=rData.find(function(r){return r.match_id===entry.match_id;});
      if(!rx)return;
      var hg=rx.home_goals,ag=rx.away_goals;
      var winner=hg>ag?rx.home:(ag>hg?rx.away:'Draw');
      entry.result=winner.toLowerCase()===entry.pick.toLowerCase()?'W':'L';
      changed=true;
    });
    if(changed)localStorage.setItem('nmw_pred_log',JSON.stringify(log));
  }catch(e){}
}
(async function(){await settlePredictions();renderPage();})();
